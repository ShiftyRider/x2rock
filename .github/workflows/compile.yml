name: Compile Fork Binary
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config build-essential

      - name: Install Modern Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Clean and Build Hardened Binary
        run: |
          cargo clean
          cargo build --release --locked
        env:
          # Keep the Rust compiler safe
          RUSTFLAGS: "-C target-cpu=x86-64"
          # FORCE the C compiler to stick to standard x86-64 instructions and safer O2 optimization
          CFLAGS: "-march=x86-64 -O2"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x2rock-linux-binary
          path: target/release/x2rock
