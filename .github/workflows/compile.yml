name: Compile Fork Binary
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config build-essential

      - name: Install Modern Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build Optimized Generic Binary
        run: cargo build --release --locked
        env:
          # Force the compiler to use standard x86-64 instructions only (no AVX)
          RUSTFLAGS: "-C target-cpu=x86-64"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x2rock-linux-binary
          path: target/release/x2rock
