name: Compile Fork Binary
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config build-essential

      - name: Install Modern Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Clean and Build Hardened Generic Binary
        run: |
          cargo clean
          cargo build --release --locked
        env:
          RUSTFLAGS: "-C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma,-bmi1,-bmi2,-sse3,-ssse3,-sse4.1,-sse4.2,-popcnt"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x2rock-linux-binary
          path: target/release/x2rock
