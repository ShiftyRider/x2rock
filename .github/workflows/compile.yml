name: Compile x2rock Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build Generic Release Binary
        run: cargo build --release --locked --bin x2rock
        env:
          RUSTFLAGS: "-C target-cpu=generic"
          CFLAGS: "-march=generic"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x2rock-cli-binary
          path: target/release/x2rock
